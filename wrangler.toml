name = "eduvision-ai"
main = "worker/src/index.ts"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]

# Preserve variables configured in the Cloudflare dashboard during Git/Wrangler
# deployments. API keys must still be stored as encrypted Secrets.
keep_vars = true

# Serve the built React app as static assets. Because every request reaches the
# Worker first, the catch-all route forwards non-API requests through ASSETS.
[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
# Anthropic-compatible endpoint. The API key remains an encrypted Secret.
API_URL = "https://api.mytokk.com"
# Optional model override (defaults to claude-sonnet-4-6).
API_MODEL = "claude-sonnet-4-6"

# The API key must NEVER be hardcoded. Store it as an encrypted Secret in the
# Cloudflare dashboard, or set it with:
#   wrangler secret put API_KEY
#
# R2 bucket for uploaded homework images.
# Create one with:  wrangler r2 bucket create eduvision-media
# [r2_buckets]
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "eduvision-media"
